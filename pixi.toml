[workspace]
name = "qshare"
channels = ["conda-forge"]
platforms = ["linux-64"]

[system-requirements]
cuda = "12"

[dependencies]
python = "3.11.*"
pip = "*"
numpy = "1.26.4.*"
scipy = "1.10.*"
scikit-learn = "*"
matplotlib = "*"
pandas = "*"
tqdm = "*"
pytest = ">=9.1.1,<10"
pytorch-gpu = "*"
cuda-version = "12.*"
torchvision = "*"
pillow = "*"

[pypi-dependencies]
clip = { git = "https://github.com/openai/CLIP.git" }
requests = "*"
huggingface-hub = ">=2.2.0, <3"
sentence-transformers = ">=5.7.0, <6"
pyarrow = ">=26.0.0, <27"
transformers = ">=5.20.1, <6"
